name: PR Validation Checks

on:
  pull_request:
    branches:
      - dev
      - 'release/**'

jobs:
  validate:
    name: Lint, Test & Build PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Release scripts test matrix
        run: bash scripts/test-workflow-cases.sh
